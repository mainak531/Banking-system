spring.application.name=api-gateway
server.port=8080

# Spring Cloud Gateway MVC Routes
# Account Service — manages accounts, balances, block/credit/deduct
spring.cloud.gateway.mvc.routes[0].id=account-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/accounts/**

# Transaction Service — transfers, history, OTP verification
spring.cloud.gateway.mvc.routes[1].id=transaction-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/transactions/**

# Payment Service — payment gateway integrations (UPI, NEFT, RTGS)
spring.cloud.gateway.mvc.routes[2].id=payment-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8085
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/payments/**

# ACTUATOR CONFIGURATION
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always 
